.0" y="425.8" class="bar-val">12</text>  <text x="646.0" y="448" class="label">512</text>  <rect x="698.0" y="429.9" width="24.0" height="0.1" class="bar-go" rx="2" />  <rect x="726.0" y="430.0" width="24.0" height="0.0" class="bar-ts" rx="2" />  <text x="710.0" y="425.9" class="bar-val">4</text>  <text x="724.0" y="448" class="label">1024</text></svg>
