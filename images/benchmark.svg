<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="850" height="520" viewBox="0 0 850 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #24292e; text-anchor: middle; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #586069; text-anchor: middle; }
    .axis { stroke: #e1e4e8; stroke-width: 1; }
    .grid { stroke: #eaecef; stroke-width: 1; stroke-dasharray: 4 4; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #586069; text-anchor: middle; }
    .y-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #586069; text-anchor: end; }
    .bar-go { fill: #007acd; transition: fill 0.3s; }
    .bar-go:hover { fill: #0056b3; }
    .bar-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #24292e; text-anchor: middle; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #24292e; }
  </style>

  <rect width="850" height="520" class="bg" rx="8" />

  <!-- Title & Subtitle -->
  <text x="425" y="35" class="title">Levenshtein-go Performance Benchmark</text>
  <text x="425" y="55" class="subtitle">Execution Time (ns/op, lower is better) across Input String Lengths (N)</text>

  <!-- Legend -->
  <rect x="350" y="70" width="14" height="14" fill="#007acd" rx="2" />
  <text x="370" y="82" class="legend-text">Go Port (Myers' Bit-Parallel)</text>

  <!-- Axes & Grid -->
  <line x1="80" y1="110" x2="80" y2="440" class="axis" />
  <line x1="80" y1="440" x2="820" y2="440" class="axis" />

  <!-- Grid lines & Y labels (Max 1,600,000 ns/op) -->
  <g>
    <line x1="80" y1="440" x2="820" y2="440" class="grid" /><text x="70" y="444" class="y-label">0</text>
    <line x1="80" y1="357.5" x2="820" y2="357.5" class="grid" /><text x="70" y="361.5" class="y-label">400k</text>
    <line x1="80" y1="275" x2="820" y2="275" class="grid" /><text x="70" y="279" class="y-label">800k</text>
    <line x1="80" y1="192.5" x2="820" y2="192.5" class="grid" /><text x="70" y="196.5" class="y-label">1.2M</text>
    <line x1="80" y1="110" x2="820" y2="110" class="grid" /><text x="70" y="114" class="y-label">1.6M</text>
  </g>
  <rect x="105.0" y="403.9" width="40.0" height="36.1" class="bar-go" rx="3" />  <text x="125.0" y="462" class="label">4</text>  <text x="125.0" y="397.9" class="bar-val">175k</text>  <rect x="180.0" y="400.6" width="40.0" height="39.4" class="bar-go" rx="3" />  <text x="200.0" y="462" class="label">8</text>  <text x="200.0" y="394.6" class="bar-val">191k</text>  <rect x="255.0" y="414.1" width="40.0" height="25.9" class="bar-go" rx="3" />  <text x="275.0" y="462" class="label">16</text>  <text x="275.0" y="408.1" class="bar-val">125k</text>  <rect x="330.0" y="404.3" width="40.0" height="35.7" class="bar-go" rx="3" />  <text x="350.0" y="462" class="label">32</text>  <text x="350.0" y="398.3" class="bar-val">173k</text>  <rect x="405.0" y="404.6" width="40.0" height="35.4" class="bar-go" rx="3" />  <text x="425.0" y="462" class="label">64</text>  <text x="425.0" y="398.6" class="bar-val">172k</text>  <rect x="480.0" y="382.8" width="40.0" height="57.2" class="bar-go" rx="3" />  <text x="500.0" y="462" class="label">128</text>  <text x="500.0" y="376.8" class="bar-val">277k</text>  <rect x="555.0" y="368.2" width="40.0" height="71.8" class="bar-go" rx="3" />  <text x="575.0" y="462" class="label">256</text>  <text x="575.0" y="362.2" class="bar-val">348k</text>  <rect x="630.0" y="318.6" width="40.0" height="121.4" class="bar-go" rx="3" />  <text x="650.0" y="462" class="label">512</text>  <text x="650.0" y="312.6" class="bar-val">589k</text>  <rect x="705.0" y="144.2" width="40.0" height="295.8" class="bar-go" rx="3" />  <text x="725.0" y="462" class="label">1024</text>  <text x="725.0" y="138.2" class="bar-val">1.4M</text></svg>