<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="880" height="520" viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #24292e; text-anchor: middle; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #586069; text-anchor: middle; }
    .axis { stroke: #e1e4e8; stroke-width: 1; }
    .grid { stroke: #eaecef; stroke-width: 1; stroke-dasharray: 4 4; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #586069; text-anchor: middle; }
    .y-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #586069; text-anchor: end; }
    .bar-go { fill: #007acd; }
    .bar-ts { fill: #e34c26; }
    .bar-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #24292e; text-anchor: middle; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #24292e; }
  </style>

  <rect width="880" height="520" class="bg" rx="8" />

  <text x="440" y="35" class="title">Levenshtein Distance Throughput: Go Port vs Original TypeScript</text>
  <text x="440" y="55" class="subtitle">ops/sec across 500 pairs of length-N strings (higher is better, same machine)</text>

  <rect x="300" y="70" width="14" height="14" fill="#007acd" rx="2" />
  <text x="320" y="82" class="legend-text">Go Port (byte-indexed Myers)</text>
  <rect x="510" y="70" width="14" height="14" fill="#e34c26" rx="2" />
  <text x="530" y="82" class="legend-text">fastest-levenshtein (TypeScript)</text>

  <line x1="80" y1="120" x2="80" y2="430" class="axis" />
  <line x1="80" y1="430" x2="820" y2="430" class="axis" />

  <!-- Y grid: 0, 5k, 10k, 15k, 20k -->
  <g>
    <line x1="80" y1="430" x2="820" y2="430" class="grid" /><text x="70" y="434" class="y-label">0</text>
    <line x1="80" y1="352.5" x2="820" y2="352.5" class="grid" /><text x="70" y="356.5" class="y-label">5k</text>
    <line x1="80" y1="275" x2="820" y2="275" class="grid" /><text x="70" y="279" class="y-label">10k</text>
    <line x1="80" y1="197.5" x2="820" y2="197.5" class="grid" /><text x="70" y="201.5" class="y-label">15k</text>
    <line x1="80" y1="120" x2="820" y2="120" class="grid" /><text x="70" y="124" class="y-label">20k</text>
  </g>
